name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: npm run test:all
    runs-on: windows-latest
    defaults:
      run:
        working-directory: personal-workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-workbench/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all
